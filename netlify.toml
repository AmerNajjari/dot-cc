[build]
  publish = "public"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Client questionnaire (AlasilaCX): reachable by link only, kept out of search.
[[headers]]
  for = "/alasila-cx/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Client proposal (Travel Gate): password-locked page, reachable by link only, kept out of
# search. The file in this repository is encrypted (tools in amer-os: lock_page.py).
[[headers]]
  for = "/travelgate/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[redirects]]
  from = "/Travelgate"
  to = "/travelgate/"
  status = 301

[[redirects]]
  from = "/Travelgate/"
  to = "/travelgate/"
  status = 301

# Client questionnaire (AIIC): reachable by link only, kept out of search. Answers are emailed through
# FormSubmit (formsubmit.co) to an@dot-cs.com, never into this repository.
[[headers]]
  for = "/aiic/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/AIIC"
  to = "/aiic/"
  status = 301

[[redirects]]
  from = "/AIIC/"
  to = "/aiic/"
  status = 301
