function bytes(b64) { var s = atob(b64), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
document.getElementById("f").addEventListener("submit", async function (e) {
  e.preventDefault();
  var go = document.getElementById("go"), err = document.getElementById("err");
  go.disabled = true; err.textContent = "";
  try {
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(document.getElementById("pw").value), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(LOCK.salt), iterations: LOCK.rounds, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(LOCK.iv) }, key, bytes(LOCK.data));
    var html = new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  } catch (x) {
    err.textContent = "كلمة المرور غير صحيحة · Wrong password";
    go.disabled = false;
  }
});
