<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<base href="/helixion-platform/">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helixion App</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="growth.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: var(--t-md); line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input, textarea { font: inherit; color: inherit; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
  * { scrollbar-color: var(--line-strong) transparent; scrollbar-width: thin; }
  [dir="rtl"] .eyebrow { letter-spacing: 0; text-transform: none; font-family: var(--font-ar); font-weight: 600; }

  .app { display: grid; grid-template-columns: 232px 1fr; grid-template-rows: 60px 1fr; grid-template-areas: "rail top" "rail main"; height: 100vh; }

  /* rail */
  .rail { grid-area: rail; background: var(--bg-sunk); display: flex; flex-direction: column; padding: var(--s5) var(--s3); gap: var(--s1); }
  .brand { display: flex; align-items: center; padding: 0 var(--s3) var(--s6); color: var(--ink); }
  .brand svg.full { width: 128px; height: auto; display: block; }
  .nav { display: flex; align-items: center; gap: var(--s3); padding: 9px var(--s3); border-radius: var(--r-md); color: var(--ink-muted); font-weight: 500; font-size: var(--t-sm); position: relative; transition: color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease); text-align: start; }
  .nav svg { width: 18px; height: 18px; flex: none; }
  .nav:hover { color: var(--ink); background: var(--line); }
  .nav[aria-current="page"] { color: var(--point); background: var(--tint-act); }
  .nav[aria-current="page"]::before { content: ""; position: absolute; inset-inline-start: -12px; top: 8px; bottom: 8px; width: 3px; border-radius: 3px; background: var(--point); }
  .nav .count { margin-inline-start: auto; font-size: var(--t-xs); color: var(--hold-ink); }
  .rail-foot { margin-top: auto; padding: var(--s3); font-size: var(--t-xs); color: var(--ink-muted); }

  /* top bar */
  .top { grid-area: top; display: flex; align-items: center; gap: var(--s4); padding: 0 var(--s5); border-bottom: 1px solid var(--line); }
  .top h1 { font-family: var(--font-display); font-size: var(--t-lg); font-weight: 600; }
  [dir="rtl"] .top h1 { font-family: var(--font-ar); }
  .tenant { font-size: var(--t-xs); color: var(--ink-muted); }
  .top .spacer { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r-pill); padding: 2px; }
  .seg button { padding: 4px 12px; border-radius: var(--r-pill); font-size: var(--t-xs); font-weight: 600; color: var(--ink-muted); }
  .seg button[aria-pressed="true"] { background: var(--surface-raised); color: var(--ink); }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--tint-act); color: var(--point); display: grid; place-items: center; font-size: var(--t-xs); font-weight: 600; }

  main { grid-area: main; overflow: hidden; }
  .screen { height: 100%; display: none; }
  .screen.on { display: grid; }

  /* shared bits */
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 10px; border-radius: var(--r-pill); font-size: var(--t-xs); font-weight: 600; white-space: nowrap; }
  .chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .chip.send { background: var(--tint-send); color: var(--send-ink); }
  .chip.hold { background: var(--tint-hold); color: var(--hold-ink); }
  .chip.stop { background: var(--tint-stop); color: var(--stop-ink); }
  .chip.read { background: var(--tint-read); color: var(--read); }
  .chip.neutral { background: var(--line); color: var(--ink-muted); }
  .chip.neutral::before { display: none; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); height: 40px; padding: 0 var(--s5); border-radius: var(--r-pill); font-weight: 600; font-size: var(--t-sm); transition: background var(--dur-fast) var(--ease), box-shadow var(--dur) var(--ease); white-space: nowrap; }
  .btn.primary { background: var(--act); color: var(--on-act); box-shadow: var(--glow); }
  .btn.primary:hover { background: var(--act-hover); }
  .btn.secondary { border: 1px solid var(--line-strong); }
  .btn.secondary:hover { background: var(--line); }
  .btn.quiet { color: var(--point); padding: 0 var(--s2); height: 32px; }
  .btn.danger { color: var(--stop-ink); padding: 0 var(--s2); height: 32px; font-size: var(--t-xs); }
  .btn:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
  .btn.done { background: var(--tint-act); color: var(--point); box-shadow: none; }
  .sample-tag { font-size: var(--t-xs); color: var(--ink-muted); }
  .muted { color: var(--ink-muted); }
  .scroll { overflow-y: auto; }

  /* inbox */
  #inbox { grid-template-columns: 320px 1fr 380px; }
  .list { border-inline-end: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .list-head { padding: var(--s4); display: flex; flex-direction: column; gap: var(--s3); }
  .search { height: 38px; width: 100%; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); padding: 0 var(--s3); }
  .search::placeholder { color: var(--ink-muted); }
  .filters { display: flex; gap: var(--s2); }
  .filters button { font-size: var(--t-xs); font-weight: 600; padding: 4px 12px; border-radius: var(--r-pill); color: var(--ink-muted); }
  .filters button[aria-pressed="true"] { background: var(--surface-raised); color: var(--ink); }
  .rows { flex: 1; overflow-y: auto; padding: 0 var(--s2) var(--s4); }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 2px var(--s3); width: 100%; text-align: start; padding: var(--s3); border-radius: var(--r-md); transition: background var(--dur-fast) var(--ease); }
  .row:hover { background: var(--line); }
  .row[aria-selected="true"] { background: var(--tint-act); }
  .row .who { font-weight: 600; font-size: var(--t-sm); display: flex; align-items: center; gap: var(--s2); }
  .row .time { font-size: var(--t-xs); color: var(--ink-muted); }
  .row .preview { grid-column: 1; font-family: var(--font-ar); font-size: var(--t-sm); color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ch { font-size: 10px; font-weight: 600; color: var(--ink-muted); border: 1px solid var(--line-strong); border-radius: var(--r-pill); padding: 0 6px; }

  .thread { display: flex; flex-direction: column; min-height: 0; }
  .thread-head { padding: var(--s4) var(--s5); display: flex; align-items: center; gap: var(--s3); border-bottom: 1px solid var(--line); }
  .thread-head h2 { font-family: var(--font-display); font-size: var(--t-md); font-weight: 600; }
  .msgs { flex: 1; overflow-y: auto; padding: var(--s5); display: flex; flex-direction: column; gap: var(--s4); }
  .day { align-self: center; font-size: var(--t-xs); color: var(--ink-muted); }
  .bubble { max-width: 72%; padding: var(--s3) var(--s4); border-radius: var(--r-lg); background: var(--surface-raised); align-self: flex-start; }
  .bubble.agent { background: var(--tint-act); align-self: flex-end; }
  .bubble .txt { font-family: var(--font-ar); font-size: 17px; line-height: 1.6; }
  .bubble .gloss { font-size: var(--t-xs); color: var(--ink-muted); margin-top: var(--s1); }
  .bubble .meta { font-size: var(--t-xs); color: var(--ink-muted); margin-top: var(--s1); }
  .sys { align-self: center; font-size: var(--t-xs); color: var(--hold-ink); background: var(--tint-hold); padding: 4px 12px; border-radius: var(--r-pill); }
  .composer { display: flex; gap: var(--s3); padding: var(--s4) var(--s5); border-top: 1px solid var(--line); }
  .composer input { flex: 1; height: 40px; border-radius: var(--r-pill); background: var(--surface); border: 1px solid var(--line); padding: 0 var(--s4); }
  .composer input::placeholder { color: var(--ink-muted); }

  .panel { border-inline-start: 1px solid var(--line); background: var(--bg-sunk); overflow-y: auto; padding: var(--s5); display: flex; flex-direction: column; gap: var(--s5); }
  .strand-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s2); margin-bottom: var(--s3); }
  .strand-head .eyebrow.r { color: var(--read); }
  .strand-head .eyebrow.a { color: var(--account); }
  .bars { display: flex; flex-direction: column; gap: var(--s3); }
  .bar { display: grid; grid-template-columns: 1fr auto; gap: 4px var(--s2); font-size: var(--t-sm); }
  .bar .track { grid-column: 1 / -1; height: 4px; border-radius: 4px; background: var(--tint-read); overflow: hidden; }
  .bar .fill { height: 100%; background: var(--read); border-radius: 4px; transition: width var(--dur-slow) var(--ease); }
  .bar .v { color: var(--read); font-size: var(--t-xs); }
  .intent { font-size: var(--t-sm); margin-top: var(--s1); }
  .helix { display: block; width: 100%; height: 36px; }
  .events { list-style: none; display: flex; flex-direction: column; gap: var(--s3); }
  .events li { display: grid; grid-template-columns: 12px 1fr auto; gap: var(--s3); align-items: start; font-size: var(--t-sm); }
  .events .dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 6px; border: 2px solid var(--account); }
  .events .dot.closed { background: var(--account); }
  .events li.money .dot { border-color: var(--stop-ink); }
  .events li.money .lbl { color: var(--stop-ink); }
  .events .t { font-size: var(--t-xs); color: var(--ink-muted); }
  .events .state { grid-column: 2; font-size: var(--t-xs); color: var(--ink-muted); margin-top: -8px; }
  .decision { background: var(--surface); border-radius: var(--r-lg); padding: var(--s4); display: flex; flex-direction: column; gap: var(--s3); }
  .decision .rule { font-size: var(--t-xs); color: var(--ink-muted); }
  .decision p { font-size: var(--t-sm); }
  .decision .who { font-size: var(--t-xs); color: var(--ink-muted); }
  .decision .actions { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); margin-top: var(--s2); }

  /* generic page screens */
  .page { overflow-y: auto; padding: var(--s6) var(--s6) var(--s8); }
  .page-inner { max-width: 1040px; display: flex; flex-direction: column; gap: var(--s6); }
  .lede { color: var(--ink-muted); max-width: 64ch; font-size: var(--t-sm); }
  .table { width: 100%; border-collapse: collapse; font-size: var(--t-sm); }
  .table th { text-align: start; font-family: var(--font-display); font-size: var(--t-xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); padding: 0 var(--s3) var(--s3); }
  [dir="rtl"] .table th { font-family: var(--font-ar); letter-spacing: 0; text-transform: none; }
  .table td { padding: var(--s3); border-top: 1px solid var(--line); vertical-align: top; }
  .table tr:hover td { background: var(--line); }
  .task { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: var(--s5); padding: var(--s4) var(--s5); background: var(--surface); border-radius: var(--r-lg); }
  .task .reason { font-size: var(--t-sm); }
  .task .reason b { display: block; font-weight: 600; margin-bottom: 2px; }
  .task .age { font-size: var(--t-xs); color: var(--ink-muted); }
  .tasks { display: flex; flex-direction: column; gap: var(--s3); }
  .camp { display: grid; grid-template-columns: 1.2fr 1fr; gap: var(--s6); background: var(--surface); border-radius: var(--r-lg); padding: var(--s5); }
  .camp .msg { font-family: var(--font-ar); font-size: var(--t-lg); line-height: 1.6; }
  .split { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s5); }
  .split .n { font-family: var(--font-data); font-size: var(--t-2xl); font-weight: 500; line-height: 1; }
  .split .g { display: flex; flex-direction: column; gap: var(--s2); }
  .split .g.send .n { color: var(--send-ink); } .split .g.hold .n { color: var(--hold-ink); } .split .g.none .n { color: var(--ink-muted); }
  .split ul { list-style: none; font-size: var(--t-xs); color: var(--ink-muted); display: flex; flex-direction: column; gap: 2px; }
  .head-row { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s4); flex-wrap: wrap; }
  .head-row h2 { font-family: var(--font-display); font-size: var(--t-xl); font-weight: 600; line-height: 1.2; }
  [dir="rtl"] .head-row h2, [dir="rtl"] .thread-head h2 { font-family: var(--font-ar); }

  .empty { display: none; flex-direction: column; align-items: center; text-align: center; gap: var(--s3); padding: var(--s7) var(--s4); color: var(--ink-muted); font-size: var(--t-sm); }
  .empty svg { width: 160px; height: 36px; }

  /* modal */
  .scrim { position: fixed; inset: 0; background: rgba(5,2,22,.7); display: none; place-items: center; z-index: 50; padding: var(--s4); }
  .scrim.on { display: grid; }
  .modal { background: var(--surface-raised); border-radius: var(--r-lg); padding: var(--s5); width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--s4); box-shadow: var(--shadow); }
  .modal h3 { font-family: var(--font-display); font-size: var(--t-lg); font-weight: 600; }
  .modal textarea { min-height: 88px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line-strong); padding: var(--s3); resize: vertical; }
  .modal .actions { display: flex; justify-content: space-between; align-items: center; }
  .toast { position: fixed; bottom: var(--s5); inset-inline-start: 50%; transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--surface-raised); padding: var(--s3) var(--s5); border-radius: var(--r-pill); font-size: var(--t-sm); box-shadow: var(--shadow); transition: all var(--dur) var(--ease); pointer-events: none; z-index: 60; }
  [dir="rtl"] .toast { transform: translateX(50%) translateY(20px); }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  [dir="rtl"] .toast.on { transform: translateX(50%) translateY(0); }

  .back { display: none; }
  .panel-toggle { display: none; }
  .brand .mark { display: none; }
  body:not([data-screen="inbox"]) .panel-toggle { display: none; }

  /* responsive */
  @media (max-width: 1200px) { #inbox { grid-template-columns: 280px 1fr 340px; } }
  @media (max-width: 1024px) {
    .app { grid-template-columns: 72px 1fr; }
    .nav span, .rail-foot, .nav .count { display: none; }
    .nav { justify-content: center; padding: 10px; }
    .brand { justify-content: center; padding: 0 0 var(--s5); }
    #inbox { grid-template-columns: 280px 1fr; }
    #inbox .panel { display: none; }
    #inbox.panel-open .panel { display: flex; position: fixed; inset-block: 60px 0; inset-inline-end: 0; width: min(380px, 100%); z-index: 20; box-shadow: var(--shadow); }
    .panel-toggle { display: inline-flex; }
    .brand .full { display: none; }
    .brand .mark { display: block; width: 32px; }
    .camp { grid-template-columns: 1fr; }
  }
  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 56px 1fr 60px; grid-template-areas: "top" "main" "rail"; }
    .rail { flex-direction: row; padding: var(--s2); justify-content: space-around; border-top: 1px solid var(--line); }
    .brand { display: none; }
    .nav[aria-current="page"]::before { display: none; }
    .top { padding: 0 var(--s4); }
    .tenant, .avatar, .seg[aria-label="Theme"] { display: none; }
    .top { gap: var(--s2); }
    .top h1 { font-size: var(--t-md); }
    .panel-toggle { height: 34px; padding: 0 var(--s4); }
    #inbox.panel-open .panel { inset-block: 56px 60px; width: 100%; }
    body { overflow-x: hidden; }
    #inbox { grid-template-columns: 1fr; }
    #inbox .thread { display: none; }
    #inbox.open .list { display: none; }
    #inbox.open .thread { display: flex; }
    .back { display: inline-flex; }
    .page { padding: var(--s5) var(--s4) var(--s7); }
    .task { grid-template-columns: 1fr auto; }
    .task .chip, .task .age { grid-column: 1; }
    .split { grid-template-columns: 1fr; }
    .table-wrap { overflow-x: auto; }
    .bubble { max-width: 88%; }
  }
  [dir="rtl"] .flip { transform: scaleX(-1); }
</style>
</head>

  const pt = (x, ph) => mid + A * Math.sin((x / P) * 2 * Math.PI + ph + HX_PH);
  let a = '', b = '', rungs = '';
  for (let x = 0; x <= w; x += 2) { a += `${x ? 'L' : 'M'}${x},${pt(x, 0).toFixed(2)}`; b += `${x ? 'L' : 'M'}${x},${pt(x, Math.PI).toFixed(2)}`; }
  const n = Math.floor(w / (P / 4)), hot = dis ? Math.round(n / 2) : -1;
  for (let i = 1; i < n; i++) {
    const x = i * P / 4, y1 = pt(x, 0), y2 = pt(x, Math.PI), span = Math.abs(y1 - y2) / (2 * A);
    if (i === hot || i === hot + 1) rungs += `<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="${hold}" stroke-width="2" stroke-linecap="round"/><circle cx="${x}" cy="${y1}" r="2.5" fill="${hold}"/><circle cx="${x}" cy="${y2}" r="2.5" fill="${hold}"/>`;
    else if (span > .05) rungs += `<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="${acc}" stroke-opacity="${(.35 * span).toFixed(2)}" stroke-width="1" stroke-linecap="round"/>`;
  }
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.innerHTML = rungs + `<path d="${a}" fill="none" stroke="${read}" stroke-width="1.5" stroke-linecap="round"/><path d="${b}" fill="none" stroke="${acc}" stroke-width="1.5" stroke-linecap="round"/>`;
}
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
  (function turn(t) {
    HX_PH = -(t / 4000) * 2 * Math.PI;
    document.querySelectorAll('svg.helix, svg.helix-art').forEach(s => { if (s._hx && s.getClientRects().length) helix(s, ...s._hx); });
    requestAnimationFrame(turn);
  })(0);
}

function renderRows() {
  const q = S.q.trim();
  const list = C.filter(c => (S.filter === 'all' || (S.filter === 'held') === (decOf(c) === 'hold'))
    && (!q || c.msg.includes(q) || name(c).toLowerCase().includes(q.toLowerCase())));
  $('#rows').innerHTML = list.map(c => `
    <button class="row" role="option" data-id="${c.id}" aria-selected="${c.id === S.sel}">
      <span class="who">${esc(name(c))} <span class="ch">${c.ch}</span></span><span class="time num">${c.at}</span>
      <span class="preview" dir="rtl" lang="ar">${esc(c.msg)}</span><span>${chip(decOf(c))}</span>
    </button>`).join('');
  $('#rows-empty').style.display = list.length ? 'none' : 'flex';
}

function renderThread() {
  const c = C.find(x => x.id === S.sel);
  $('#th-name').textContent = name(c);
  $('#th-sub').innerHTML = `${c.ch} · <span class="num">+966 5X XXX XX${c.id.charCodeAt(0)}</span>`;
  $('#th-chip').innerHTML = chip(decOf(c));
  const mine = (S.replies[c.id] || []).map(r => `<div class="bubble agent"><div class="txt" dir="auto">${esc(r.text)}</div><div class="meta">${t('you')} · <span class="num">${r.at}</span></div></div>`).join('');
  $('#msgs').innerHTML = `<div class="day">${t('today')}</div>
    <div class="bubble"><div class="txt" lang="ar" dir="rtl">${esc(c.msg)}</div>
    <div class="gloss">${t('translation')}: ${esc(c.en)}</div><div class="meta num">${c.at}</div></div>
    ${decOf(c) === 'hold' ? `<div class="sys">${t('heldNote')} · ${t('rule')} <span class="num">${c.rule}</span></div>` : ''}${mine}`;
  $('#reply').placeholder = t('reply');
  $('#msgs').scrollTop = 1e6;
}

function renderPanel() {
  const c = C.find(x => x.id === S.sel), r = c.read, d = decOf(c);
  const bar = (k, v) => `<div class="bar"><span>${t(k)}</span><span class="v num">${v.toFixed(2)}</span><div class="track"><div class="fill" style="width:${v * 100}%"></div></div></div>`;
  const ev = c.ev.map(([tm, en, ar, money, closed]) => `<li class="${money ? 'money' : ''}"><span class="dot ${closed ? 'closed' : ''}"></span><span class="lbl">${esc(S.lang === 'ar' ? ar : en)}</span><span class="t num">${tm}</span>${!closed && money ? `<span class="state">${t('unresolved')}</span>` : ''}</li>`).join('');
  const action = d === 'hold'
    ? `<div class="actions"><button class="btn ${S.taken[c.id] ? 'done' : 'primary'}" id="take" ${S.taken[c.id] ? 'disabled' : ''}>${t(S.taken[c.id] ? 'taken' : 'take')}</button><button class="btn danger" id="override">${t('override')}</button></div>`
    : '';
  const why = S.released[c.id] ? [`Released by you: ${S.released[c.id]}`, `رفعه أنت: ${S.released[c.id]}`] : c.why;
  $('#panel').innerHTML = `
    <section><div class="strand-head"><span class="eyebrow r">${t('reading')}</span><span class="sample-tag">${t('model')}</span></div>
      <p class="muted" style="font-size:var(--t-xs);margin-bottom:var(--s3)">${t('said')}</p>
      <div class="bars">${bar('pos', r.pos)}${bar('neg', r.neg)}${bar('sar', r.sar)}</div>
      <p class="intent">${t('intent')}: <span style="color:var(--read)">${t(r.intent)}</span></p></section>
    <div><svg class="helix" id="helix" aria-hidden="true"></svg><p class="muted" style="font-size:var(--t-xs);text-align:center;margin-top:var(--s1);${c.dis ? 'color:var(--hold-ink)' : ''}">${t(c.dis ? 'disagree' : 'agree')}</p></div>
    <section><div class="strand-head"><span class="eyebrow a">${t('account')}</span><span class="sample-tag">${t('happened')}</span></div><ul class="events">${ev}</ul></section>
    <section class="decision" aria-live="polite"><div style="display:flex;align-items:center;justify-content:space-between;gap:var(--s2)">${chip(d)}<span class="rule">${t('rule')} <span class="num">${S.released[c.id] ? '—' : c.rule}</span> · <span class="num">${t('rules')}</span></span></div>
      <p>${esc(S.lang === 'ar' ? why[1] : why[0])}</p>
      <span class="who">${S.released[c.id] ? t('you') : t('decidedBy')}<span class="num">${S.released[c.id] ? '' : c.at}</span></span>${action}</section>`;
  const h = $('#helix'); helix(h, Math.max(200, h.clientWidth || 330), 36, c.dis && !S.released[c.id]);
  const take = $('#take'); if (take) take.onclick = () => { S.taken[c.id] = 1; renderPanel(); renderQueue(); toast(t('toastTaken')); $('#reply').focus(); };
  const ov = $('#override'); if (ov) ov.onclick = openOverride;
}

function renderQueue() {
  const held = C.filter(c => decOf(c) === 'hold').sort((a, b) => (a.prio === 'high' ? -1 : 1));
  $('#tasks').innerHTML = held.map((c, i) => `
    <div class="task"><span class="chip ${c.prio === 'high' ? 'stop' : 'hold'}">${t(c.prio)}</span>
      <div class="reason"><b>${esc(name(c))} · <span class="muted" style="font-weight:400">${t('rule')} <span class="num">${c.rule}</span></span></b>${esc(S.lang === 'ar' ? c.why[1] : c.why[0])}</div>
      <span class="age"><span class="num">${[19, 4][i] ?? 1}</span> ${t('ago')}</span>
      <button class="btn ${S.taken[c.id] ? 'done' : 'primary'}" data-open="${c.id}">${t(S.taken[c.id] ? 'taken' : 'open')}</button></div>`).join('');
  $('#tasks-empty').style.display = held.length ? 'none' : 'flex';
  const n = held.filter(c => !S.taken[c.id]).length;
  $('#queue-count').textContent = n || '';
}

function renderCampaign() {
  const send = C.filter(c => decOf(c) === 'send'), hold = C.filter(c => decOf(c) === 'hold');
  const g = (cls, n, label, items) => `<div class="g ${cls}"><span class="eyebrow">${label}</span><span class="n">${n}</span><ul>${items}</ul></div>`;
  $('#split').innerHTML =
    g('send', send.length, t('willSend'), send.map(c => `<li>${esc(name(c))}</li>`).join('')) +
    g('hold', hold.length, t('heldRule'), hold.map(c => `<li>${esc(name(c))} · ${t('rule')} <span class="num">${c.rule}</span></li>`).join('')) +
    g('none', 1, t('noConsent'), `<li>${t('customer')} F · ${t('optout')}</li>`);
  $('#camp-sum').textContent = t('sum')(send.length, C.length + 1);
}

function renderLog() {
  const head = `<tr><th>${t('time')}</th><th>${t('contact')}</th><th>${t('readingCol')}</th><th>${t('ruleCol')}</th><th>${t('action')}</th><th>${t('by')}</th></tr>`;
  const rows = [...C].sort((a, b) => b.at.localeCompare(a.at)).map(c => `<tr><td class="num">2026-10-06 ${c.at}</td><td>${esc(name(c))}</td>
    <td><span class="chip read">${t(c.read.intent)} · <span class="num">${t('sar')} ${c.read.sar.toFixed(2)}</span></span></td>
    <td class="num">R${c.rule} · v1.0</td><td>${chip(c.dec)}</td><td class="muted">${t('decidedBy').replace(' · ', '')}</td></tr>`
    + (S.released[c.id] ? `<tr><td class="num">2026-10-06 —</td><td>${esc(name(c))}</td><td class="muted">—</td><td class="muted">override</td><td>${chip('send')}</td><td>${t('you')}: ${esc(S.released[c.id])}</td></tr>` : '')).join('');
  $('#log-table').innerHTML = head + rows;
}

function renderConsent() {
  const rows = [['A','optin','src1','2026-03-14'],['B','optin','src2','2026-05-02'],['C','optin','src1','2026-07-21'],['D','optin','src1','2026-01-09'],['E','optin','src2','2026-08-30'],['F','optout','src3','2026-09-18']];
  $('#cons-table').innerHTML = `<tr><th>${t('contact')}</th><th>${t('status')}</th><th>${t('source')}</th><th>${t('since')}</th></tr>` +
    rows.map(([id, s, src, d]) => `<tr><td>${t('customer')} ${id}</td><td><span class="chip ${s === 'optin' ? 'send' : 'stop'}">${t(s)}</span></td><td>${t(src)}</td><td class="num">${d}</td></tr>`).join('');
}

function renderAll() {
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  $('#search').placeholder = t('search');
  $('#ov-reason').placeholder = t('reasonPh');
  $('#title').textContent = t('nav.' + S.screen);
  document.body.dataset.screen = S.screen;
  document.querySelectorAll('.nav').forEach(n => n.setAttribute('aria-current', n.dataset.go === S.screen ? 'page' : 'false'));
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === S.screen));
  renderRows(); renderThread(); renderPanel(); renderQueue(); renderCampaign(); renderLog(); renderConsent();
  document.querySelectorAll('.helix-art').forEach(s => helix(s, 160, 36, false));
  if (window.renderGrowth) renderGrowth();
}

function go(screen) { S.screen = screen; $('#inbox').classList.remove('open', 'panel-open'); renderAll(); }
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 2800); }
function openOverride() { $('#ov-reason').value = ''; $('#ov-yes').disabled = true; $('#scrim').classList.add('on'); $('#ov-reason').focus(); }
function closeOverride() { $('#scrim').classList.remove('on'); }

document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', e => { e.preventDefault(); go(b.dataset.go); }));
$('#rows').addEventListener('click', e => { const r = e.target.closest('.row'); if (!r) return; S.sel = r.dataset.id; $('#inbox').classList.add('open'); renderRows(); renderThread(); renderPanel(); });
$('#tasks').addEventListener('click', e => { const b = e.target.closest('[data-open]'); if (!b) return; S.sel = b.dataset.open; go('inbox'); $('#inbox').classList.add('open'); });
$('#search').addEventListener('input', e => { S.q = e.target.value; renderRows(); });
document.querySelectorAll('[data-filter]').forEach(b => b.addEventListener('click', () => { S.filter = b.dataset.filter; document.querySelectorAll('[data-filter]').forEach(x => x.setAttribute('aria-pressed', x === b)); renderRows(); }));
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => {
  S.lang = b.dataset.lang; document.documentElement.lang = S.lang; document.documentElement.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-lang]').forEach(x => x.setAttribute('aria-pressed', x === b)); renderAll();
}));
document.querySelectorAll('[data-theme-set]').forEach(b => b.addEventListener('click', () => {
  document.documentElement.dataset.theme = b.dataset.themeSet;
  document.querySelectorAll('[data-theme-set]').forEach(x => x.setAttribute('aria-pressed', x === b)); renderAll();
}));
$('#composer').addEventListener('submit', e => {
  e.preventDefault(); const v = $('#reply').value.trim(); if (!v) return;
  const d = new Date(); (S.replies[S.sel] ||= []).push({ text: v, at: `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}` });
  $('#reply').value = ''; renderThread();
});
$('#back').addEventListener('click', () => $('#inbox').classList.remove('open'));
$('#panel-toggle').addEventListener('click', () => $('#inbox').classList.toggle('panel-open'));
$('#export').addEventListener('click', () => toast(t('toastExport')));
$('#ov-reason').addEventListener('input', e => { $('#ov-yes').disabled = e.target.value.trim().length < 4; });
$('#ov-no').addEventListener('click', closeOverride);
$('#scrim').addEventListener('click', e => { if (e.target.id === 'scrim') closeOverride(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOverride(); });
$('#ov-yes').addEventListener('click', () => { S.released[S.sel] = $('#ov-reason').value.trim(); closeOverride(); renderAll(); toast(t('toastOv')); });
window.addEventListener('resize', () => renderPanel());
renderAll();
</script>
<script src="growth.js"></script>
</body>
</html>
