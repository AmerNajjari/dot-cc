:root{
  --bar-h:44px;
  --studio:#FF0000; --tech:#00F4C9; --cc:#0068FF;
  --muted:#9A9A9A;
  --mark:clamp(128px,24vh,220px);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#000;color:#fff;font-family:"dot Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
a{color:inherit}

/* group bar: the one strip that is the same on every site */
.bar{flex:none;height:var(--bar-h);display:flex;align-items:stretch;gap:clamp(18px,3.2vw,40px);padding:0 clamp(14px,3vw,28px);background:#000;border-bottom:1px solid rgba(255,255,255,.12);position:relative;z-index:10}
:where(button.home,button.site,button.panel){font:inherit;color:inherit;background:none;border:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none}
.home{display:flex;align-items:center;padding:0}
.home img{display:block;height:19px;width:auto}
.sites{display:flex;align-items:stretch;gap:clamp(14px,2.6vw,32px);min-width:0}
.site{position:relative;display:flex;align-items:center;gap:8px;padding:0;color:var(--muted);text-decoration:none;font-size:.875rem;font-weight:500;white-space:nowrap;transition:color .15s}
.site i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--c);opacity:.5;transition:opacity .2s,transform .2s}
.site:hover{color:#fff}
.site:hover i{opacity:1}
.site[aria-current="page"]{color:#fff}
.site[aria-current="page"] i{opacity:1;transform:scale(1.3)}
.site[aria-current="page"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--c)}
.l-short{display:none}
.bar button:focus-visible{outline:2px solid #fff;outline-offset:2px;border-radius:2px}
@media (max-width:640px){
  :root{--bar-h:42px}
  .l-full{display:none}.l-short{display:inline}
  .site{font-size:.8125rem;gap:7px}
  .bar{gap:18px}
}

/* stage */
.stage{flex:1 1 auto;min-height:0;position:relative;background:#000}
.frames iframe{position:absolute;inset:0;z-index:1;width:100%;height:100%;border:0;display:block}
.frames iframe[hidden]{display:none}

/* front door: three sites, three dots */
.door{position:absolute;inset:0;z-index:2;display:flex;overflow:auto;outline:none}
.door[hidden]{display:none}
.panel{flex:1 1 0;min-width:0;width:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(24px,4vh,44px);padding:clamp(28px,5vh,60px) clamp(20px,3vw,44px);text-decoration:none;text-align:center;position:relative;transition:flex-grow .55s cubic-bezier(.2,.8,.2,1)}
@media (hover:hover) and (min-width:761px){.panel:hover{flex-grow:1.22}}
.panel:focus-visible{outline:3px solid var(--c);outline-offset:-10px}
.p-studio{background:#FFFFFF;color:#1A1A1A;--c:var(--studio)}
.p-tech{background:#121D21;color:#E4F1EE;--c:var(--tech)}
.p-cc{background:#000;color:#fff;--c:var(--cc)}

.logo{display:flex;flex-direction:column;align-items:center;gap:calc(var(--mark) * .1);flex:none}
.logo .mark{display:block;width:var(--mark);height:var(--mark);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.nm{font-family:"dot AG Light",system-ui,sans-serif;font-weight:300;font-size:calc(var(--mark) * .135);line-height:1.02;letter-spacing:-.01em;text-align:center}
@media (hover:hover){.panel:hover .logo .mark{transform:scale(1.04)}}
.txt{display:flex;flex-direction:column;align-items:center;gap:clamp(18px,3vh,30px)}
.tag{margin:0;max-width:22ch;font-size:clamp(1.02rem,1.4vw,1.24rem);line-height:1.4;min-height:4.2em}
.p-studio .tag{font-family:"dot AG Light",system-ui,sans-serif;font-weight:300}
.p-tech .tag{font-family:"dot Utility",system-ui,sans-serif;font-weight:300;line-height:1.5}
.p-cc .tag{font-family:"dot Archivo",system-ui,sans-serif;font-weight:500;color:#dedede}
.enter{display:inline-flex;align-items:center;gap:11px;font-size:1.02rem;line-height:1}
.enter i{flex:none;width:12px;height:12px;border-radius:50%;background:var(--c);transition:transform .3s cubic-bezier(.2,.8,.2,1.5)}
.panel:hover .enter i,.panel:focus-visible .enter i{transform:scale(1.75)}
.p-studio .enter{font-family:"dot AG Heavy",system-ui,sans-serif;font-weight:900}
.p-tech .enter{font-family:"dot Utility",system-ui,sans-serif;font-weight:600}
.p-cc .enter{font-family:"dot Archivo",system-ui,sans-serif;font-weight:700;font-stretch:112%}

@media (max-width:760px){
  :root{--mark:clamp(76px,12vh,100px)}
  .door{flex-direction:column}
  .panel{flex:1 0 auto;min-height:max(172px,calc((100% - 0px) / 3));flex-direction:row;justify-content:flex-start;text-align:left;gap:clamp(18px,6vw,30px);padding:20px clamp(18px,6vw,32px)}
  .logo{width:calc(var(--mark) + 20px)}
  .txt{align-items:flex-start;gap:14px}
  .tag{min-height:0;max-width:24ch;font-size:1rem}
  .enter{font-size:.95rem}
}

/* the moment between the door and a site */
.reveal{position:absolute;inset:0;z-index:5;background:var(--rv,#000);visibility:hidden;pointer-events:none}
.reveal.on{visibility:visible;pointer-events:auto}
.reveal .load{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--c,#fff);opacity:0;transition:opacity .25s}
.reveal.wait .load{opacity:1;animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.9)}}

.nojs{position:absolute;inset:auto 0 0 0;margin:0;padding:14px 20px;background:#FF0000;color:#fff;font-size:.95rem;z-index:20}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

@media (prefers-reduced-motion:reduce){
  .panel,.logo .mark,.enter i,.site i{transition:none}
  .reveal.wait .load{animation:none}
}
</style>
</head>
